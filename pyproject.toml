[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-vision-stock-management"
version = "1.0.0"
description = "Retail shelf and activity inference using Roboflow and OpenCV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "inference-sdk>=0.9.0",
  "opencv-python>=4.8.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
retail-vision = "retail_vision.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
